name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make \
            libc6-dev libncurses5-dev device-tree-compiler \
            git zip ccache build-essential libtinfo5 lib32z1 lib32stdc++6 python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Clone GCC 4.9 toolchains
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Build kernel with Wi-Fi monitor drivers
        run: |
          export PATH="$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH"
          export ARCH=arm64
          export KBUILD_BUILD_USER=claude
          export KBUILD_BUILD_HOST=github
          ARGS="O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-"
          make $ARGS sdm450_sec_a02q_mea_mea_defconfig
          ./scripts/config --file out/.config \
            -e WLAN \
            -e WLAN_VENDOR_ATH \
            -e MAC80211 \
            -e WCN36XX
          make $ARGS olddefconfig
          echo "=== config after olddefconfig ==="
          grep -E 'CONFIG_(WLAN_VENDOR_ATH|MAC80211|WCN36XX|CFG80211)=' out/.config || echo "(symbols NOT set!)"
          make -j"$(nproc)" $ARGS KCFLAGS="-Wno-error"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-samsung-wcn36xx
          path: |
            out/arch/arm64/boot/Image*
            out/.config
